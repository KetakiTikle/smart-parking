<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container narrow">
    <div class="card">
        <h1>Log in</h1>
        <p class="alert success" th:if="${param.registered != null}">Registration successful. Please log in.</p>
        <p class="alert success" th:if="${param.logout != null}">You have been logged out.</p>
        <p class="alert info" th:if="${param.required != null}">Please log in to continue. Your session may have expired.</p>
        <p class="alert error" th:if="${error != null}" th:text="${error}"></p>

        <form th:action="@{/login}" method="post" novalidate>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" th:value="${email}">
            <label for="password">Password</label>
            <input id="password" name="password" type="password">
            <button type="submit">Log in</button>
        </form>
        <p class="muted">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
</body>
</html>
