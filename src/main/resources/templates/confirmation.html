<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Booking Confirmed')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container narrow">
    <div class="card">
        <h1>Booking confirmed</h1>
        <p class="alert success">Your parking slot is reserved.</p>
        <dl>
            <dt>Booking ID</dt><dd th:text="'#' + ${r.reservationId}"></dd>
            <dt>Parking lot</dt><dd th:text="${r.lotName}"></dd>
            <dt>Slot</dt><dd th:text="${r.slotNumber}"></dd>
            <dt>Vehicle</dt><dd th:text="${r.vehicleNo}"></dd>
            <dt>From</dt><dd th:text="${#temporals.format(r.startTime, 'dd MMM yyyy, hh:mm a')}"></dd>
            <dt>To</dt><dd th:text="${#temporals.format(r.endTime, 'dd MMM yyyy, hh:mm a')}"></dd>
            <dt>Total cost</dt><dd th:text="'Rs. ' + ${r.totalAmount}"></dd>
            <dt>Status</dt><dd th:text="${r.status}"></dd>
        </dl>
        <a class="btn" th:href="@{/bookings}">My bookings</a>
    </div>
</main>
</body>
</html>
